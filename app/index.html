<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="./">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="تطبيق شباب الأنبا صرابامون لكشف الغياب والأنشطة والخدمة">

  <!-- Mobile Viewport for Perfect Full Screen & Responsiveness -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Web App & iOS PWA Full Screen Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- default or black-translucent with linen background matches the app seamlessly -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="شباب الأنبا صرابامون">
  <meta name="theme-color" content="#FAF7F3">
  <meta name="msapplication-navbutton-color" content="#FAF7F3">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>شباب الأنبا صرابامون</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect and Load Arabic Cairo Font for instant native typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      inset: 0;
      /* تم ضبط الخلفية لتطابق ثيم التطبيق تماماً لمنع ظهور أي حز لوني عند النوتش أو الشريط السفلي */
      background-color: #FAF7F3;
      font-family: 'Cairo', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    /* Full screen container */
    #flutter_container, flutter-view {
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: block;
      overflow: hidden;
      background-color: #FAF7F3;
    }

    /* ملء الفيديو للشاشة بالكامل في PWA بالطول وبالعرض بدون حواف سوداء ومطابقة التطبيق 100% */
    video, flt-platform-view video, flt-platform-view {
      object-fit: fill !important;
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }

    /* Loading indicator before flutter boots */
    .loading-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FAF7F3;
      color: #8E1624;
      z-index: 99999;
      transition: opacity 0.35s ease;
    }
    .loading-logo {
      font-size: 56px;
      margin-bottom: 14px;
      animation: pulse 1.6s infinite ease-in-out;
    }
    .loading-title {
      font-size: 22px;
      font-weight: 800;
      color: #8E1624;
      margin-bottom: 6px;
    }
    .loading-sub {
      font-size: 13.5px;
      color: #64748B;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.92; }
      50% { transform: scale(1.08); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-splash">
    <div class="loading-logo">⛪</div>
    <div class="loading-title">شباب الأنبا صرابامون</div>
    <div class="loading-sub">جاري فتح التطبيق...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 350);
      }
    });

    // طلب إذن الإشعارات تلقائياً عند أول تفاعل لضمان وصول تنبيهات الخدمة في PWA
    (function() {
      if ('Notification' in window && Notification.permission === 'default') {
        var askPerm = function() {
          try {
            Notification.requestPermission();
          } catch(e) {}
          window.removeEventListener('click', askPerm);
          window.removeEventListener('touchstart', askPerm);
        };
        window.addEventListener('click', askPerm);
        window.addEventListener('touchstart', askPerm);
      }

      // تسجيل الـ Service Worker مبكراً لدعم استقبال الإشعارات في الخلفية
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./push_sw.js').then(function(reg) {
            if ('periodicSync' in reg) {
              reg.periodicSync.register('church-announcements-sync', {
                minInterval: 60 * 1000
              }).catch(function() {});
            }
          }).catch(function() {});
        });
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
